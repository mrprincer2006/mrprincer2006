<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Niklit. Hyperlocal delivery.">
<style>
.sh{fill:#323c52;animation:blink 4s infinite}
@keyframes blink{0%,45%{fill:#6f8aff}80%,100%{fill:#323c52}}
.png{fill:rgba(111,138,255,.10);stroke:#6f8aff;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ping 4s linear infinite}
@keyframes ping{0%{transform:scale(0);opacity:.9}75%{transform:scale(1);opacity:.25}100%{transform:scale(1);opacity:0}}
</style>
<rect x=".5" y=".5" width="999" height="249" rx="16" fill="#10151f" stroke="#222a3b"/>
<text x="48" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#e9ecf4" letter-spacing="-1">Niklit</text>
<text x="50" y="154" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#6f8aff">Hyperlocal delivery.</text>
<text x="50" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b94a9">Built around what is close to you.</text>
