<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Monterus X. Where startups meet their people.">
<style>
.sp{stroke:#323c52;stroke-width:1;animation:spk 8s infinite}
.nd{fill:#10151f;stroke:#323c52;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:lit 8s infinite}
.lb{opacity:0;animation:lab 8s infinite}
@keyframes lit{0%{fill:#6f8aff;stroke:#6f8aff;transform:scale(1.5)}11%{fill:#6f8aff;stroke:#6f8aff;transform:scale(1.5)}13%,100%{fill:#10151f;stroke:#323c52;transform:scale(1)}}
@keyframes spk{0%,11%{stroke:#6f8aff;stroke-width:1.6}13%,100%{stroke:#323c52;stroke-width:1}}
@keyframes lab{0%{opacity:0;transform:translateX(-6px)}2%,11%{opacity:1;transform:none}13%,100%{opacity:0}}
</style>
<rect x=".5" y=".5" width="999" height="249" rx="16" fill="#10151f" stroke="#222a3b"/>
<text x="48" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#e9ecf4" letter-spacing="-1">Monterus X</text>
<text x="50" y="154" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#6f8aff">Where startups meet their people.</text>
<text x="50" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b94a9">Startups · Investors · Advertisers · Creators · Developers</text>
<line class="sp" style="animation-delay:0s" x1="690" y1="125" x2="690.0" y2="39.0"/><line class="sp" style="animation-delay:1s" x1="690" y1="125" x2="750.8" y2="64.2"/><line class="sp" style="animation-delay:2s" x1="690" y1="125" x2="776.0" y2="125.0"/><line class="sp" style="animation-delay:3s" x1="690" y1="125" x2="750.8" y2="185.8"/><line class="sp" style="animation-delay:4s" x1="690" y1="125" x2="690.0" y2="211.0"/><line class="sp" style="animation-delay:5s" x1="690" y1="125" x2="629.2" y2="185.8"/><line class="sp" style="animation-delay:6s" x1="690" y1="125" x2="604.0" y2="125.0"/><line class="sp" style="animation-delay:7s" x1="690" y1="125" x2="629.2" y2="64.2"/><circle cx="690" cy="125" r="32" fill="#10151f" stroke="#6f8aff" stroke-width="1.5"/><text x="690" y="133" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#e9ecf4">MX</text><circle class="nd" style="animation-delay:0s" cx="690.0" cy="39.0" r="8"/><circle class="nd" style="animation-delay:1s" cx="750.8" cy="64.2" r="8"/><circle class="nd" style="animation-delay:2s" cx="776.0" cy="125.0" r="8"/><circle class="nd" style="animation-delay:3s" cx="750.8" cy="185.8" r="8"/><circle class="nd" style="animation-delay:4s" cx="690.0" cy="211.0" r="8"/><circle class="nd" style="animation-delay:5s" cx="629.2" cy="185.8" r="8"/><circle class="nd" style="animation-delay:6s" cx="604.0" cy="125.0" r="8"/><circle class="nd" style="animation-delay:7s" cx="629.2" cy="64.2" r="8"/><text class="lb" style="animation-delay:0s" x="830" y="131" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#e9ecf4">Startup discovery</text><text class="lb" style="animation-delay:1s" x="830" y="131" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#e9ecf4">Investors</text><text class="lb" style="animation-delay:2s" x="830" y="131" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#e9ecf4">Advertising</text><text class="lb" style="animation-delay:3s" x="830" y="131" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#e9ecf4">Creators</text><text class="lb" style="animation-delay:4s" x="830" y="131" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#e9ecf4">Developers</text><text class="lb" style="animation-delay:5s" x="830" y="131" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#e9ecf4">Data</text><text class="lb" style="animation-delay:6s" x="830" y="131" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#e9ecf4">Wallet infrastructure</text><text class="lb" style="animation-delay:7s" x="830" y="131" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#e9ecf4">Growth</text>
