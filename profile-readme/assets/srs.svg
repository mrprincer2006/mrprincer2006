<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="SRS Vault AI. AI-powered conversation intelligence.">
<style>
.wv{fill:#6f8aff;opacity:.85;transform-box:fill-box;transform-origin:center;animation:wave 1.4s ease-in-out infinite alternate}
@keyframes wave{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.ch rect{fill:#10151f;stroke:#323c52;animation:chr 6s infinite}
.ch text{fill:#8b94a9;animation:cht 6s infinite}
@keyframes chr{0%,30%{fill:rgba(111,138,255,.14);stroke:#6f8aff}34%,100%{fill:#10151f;stroke:#323c52}}
@keyframes cht{0%,30%{fill:#e9ecf4}34%,100%{fill:#8b94a9}}
</style>
<rect x=".5" y=".5" width="999" height="249" rx="16" fill="#10151f" stroke="#222a3b"/>
<text x="48" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#e9ecf4" letter-spacing="-1">SRS Vault AI</text>
<text x="50" y="154" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#6f8aff">AI-powered conversation intelligence.</text>
<text x="50" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b94a9">Consent-based recording · Transcription · Summaries · Action items</text>
