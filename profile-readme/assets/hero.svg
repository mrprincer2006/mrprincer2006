<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Prince Raj. Real problems, built into products people use.">
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8ca0dc" stroke-opacity=".07"/></pattern>
<pattern id="gs" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6f8aff" stroke-opacity=".5"/></pattern>
<radialGradient id="fade"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#6f8aff" stop-opacity=".22"/><stop offset="1" stop-color="#6f8aff" stop-opacity="0"/></radialGradient>
<linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#6f8aff" stop-opacity="0"/><stop offset=".5" stop-color="#6f8aff"/><stop offset="1" stop-color="#6f8aff" stop-opacity="0"/></linearGradient>
<mask id="m"><rect width="1200" height="400" fill="#000"/><circle class="spot" cx="0" cy="0" r="230" fill="url(#fade)"/></mask>
<clipPath id="c"><rect width="1200" height="400" rx="20"/></clipPath>
</defs>
<style>
.spot{animation:sweep 16s ease-in-out infinite}
.glow{animation:sweep 16s ease-in-out infinite}
@keyframes sweep{0%{transform:translate(180px,120px)}50%{transform:translate(950px,250px)}100%{transform:translate(180px,120px)}}
.tw{animation:tw 5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.role{opacity:0;animation:show 9s infinite}
.r2{animation-delay:3s}.r3{animation-delay:6s}
@keyframes show{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:none}30%{opacity:1;transform:none}34%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
.bar{animation:run 6s linear infinite}
@keyframes run{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
</style>
<g clip-path="url(#c)">
<rect width="1200" height="400" fill="#0a0d14"/>
<rect width="1200" height="400" fill="url(#g)"/>
<rect width="1200" height="400" fill="url(#gs)" mask="url(#m)"/>
<circle class="glow" cx="0" cy="0" r="300" fill="url(#glow)"/>
<line x1="830" y1="70" x2="900" y2="150" stroke="#6f8aff" stroke-opacity=".28"/><line x1="830" y1="70" x2="960" y2="80" stroke="#6f8aff" stroke-opacity=".28"/><line x1="830" y1="70" x2="820" y2="170" stroke="#6f8aff" stroke-opacity=".28"/><line x1="900" y1="150" x2="960" y2="80" stroke="#6f8aff" stroke-opacity=".28"/><line x1="900" y1="150" x2="1000" y2="240" stroke="#6f8aff" stroke-opacity=".28"/><line x1="900" y1="150" x2="820" y2="170" stroke="#6f8aff" stroke-opacity=".28"/><line x1="960" y1="80" x2="1040" y2="140" stroke="#6f8aff" stroke-opacity=".28"/><line x1="1040" y1="140" x2="1120" y2="70" stroke="#6f8aff" stroke-opacity=".28"/><line x1="1040" y1="140" x2="1000" y2="240" stroke="#6f8aff" stroke-opacity=".28"/><line x1="1040" y1="140" x2="1140" y2="210" stroke="#6f8aff" stroke-opacity=".28"/><line x1="880" y1="290" x2="960" y2="330" stroke="#6f8aff" stroke-opacity=".28"/><line x1="880" y1="290" x2="1000" y2="240" stroke="#6f8aff" stroke-opacity=".28"/><line x1="880" y1="290" x2="820" y2="170" stroke="#6f8aff" stroke-opacity=".28"/><line x1="960" y1="330" x2="1000" y2="240" stroke="#6f8aff" stroke-opacity=".28"/><line x1="960" y1="330" x2="1080" y2="310" stroke="#6f8aff" stroke-opacity=".28"/><line x1="960" y1="330" x2="1050" y2="370" stroke="#6f8aff" stroke-opacity=".28"/><line x1="1000" y1="240" x2="1080" y2="310" stroke="#6f8aff" stroke-opacity=".28"/><line x1="1080" y1="310" x2="1140" y2="210" stroke="#6f8aff" stroke-opacity=".28"/><line x1="1080" y1="310" x2="1050" y2="370" stroke="#6f8aff" stroke-opacity=".28"/><circle class="tw" style="animation-delay:-1.62s" cx="830" cy="70" r="3.2" fill="#6f8aff"/><circle class="tw" style="animation-delay:-0.75s" cx="900" cy="150" r="3.2" fill="#6f8aff"/><circle class="tw" style="animation-delay:-3.25s" cx="960" cy="80" r="3.2" fill="#6f8aff"/><circle class="tw" style="animation-delay:-0.36s" cx="1040" cy="140" r="3.2" fill="#6f8aff"/><circle class="tw" style="animation-delay:-2.68s" cx="1120" cy="70" r="3.2" fill="#6f8aff"/><circle class="tw" style="animation-delay:-1.83s" cx="880" cy="290" r="3.2" fill="#6f8aff"/><circle class="tw" style="animation-delay:-0.29s" cx="960" cy="330" r="3.2" fill="#6f8aff"/><circle class="tw" style="animation-delay:-2.54s" cx="1000" cy="240" r="3.2" fill="#6f8aff"/><circle class="tw" style="animation-delay:-0.19s" cx="1080" cy="310" r="3.2" fill="#6f8aff"/><circle class="tw" style="animation-delay:-2.17s" cx="1140" cy="210" r="3.2" fill="#6f8aff"/><circle class="tw" style="animation-delay:-0.35s" cx="820" cy="170" r="3.2" fill="#6f8aff"/><circle class="tw" style="animation-delay:-0.45s" cx="1050" cy="370" r="3.2" fill="#6f8aff"/>
<text x="64" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="108" fill="#e9ecf4" letter-spacing="-2">Prince Raj</text>
<text x="66" y="244" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="32" fill="#8b94a9">Real problems, built into products people use.</text>
<text x="66" y="318" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8b94a9">I'm a</text>
<text class="role" x="124" y="318" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#6f8aff">founder</text>
<text class="role r2" x="124" y="318" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#6f8aff">product builder</text>
<text class="role r3" x="124" y="318" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#6f8aff">software developer</text>
<rect class="bar" x="0" y="396" width="300" height="4" fill="url(#scan)"/>
</g>
<rect x=".5" y=".5" width="1199" height="399" rx="20" fill="none" stroke="#323c52"/>
</svg>